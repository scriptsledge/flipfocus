<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlipFocus | Performance Flow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --primary: #38bdf8;
            --secondary: #818cf8;
            --success: #10b981;
            --slate: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-border: rgba(255, 255, 255, 0.05);
            --active-glow: rgba(56, 189, 248, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(129, 140, 248, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }

        .header { text-align: center; margin-bottom: 60px; z-index: 10; }
        .header h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.02em; color: var(--text-main); margin-bottom: 4px; }
        .header p { color: var(--text-muted); font-size: 0.9rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; }

        .dashboard-container {
            position: relative;
            width: 85vmin;
            height: 85vmin;
            max-width: 550px;
            max-height: 550px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1); /* Bouncy fluid transition */
        }

        .profile-label {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 140px;
            margin-left: -70px;
            margin-top: -20px;
            text-align: center;
            transition: all 0.4s ease;
            pointer-events: none;
        }

        .label-content {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: transparent;
        }

        .profile-label.active .label-content {
            color: var(--text-main);
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 0 20px var(--active-glow);
            transform: scale(1.1);
        }

        /* Initial positions */
        #label-1 { transform: rotate(0deg) translateY(-42vmin); }
        #label-2 { transform: rotate(90deg) translateY(-42vmin); }
        #label-3 { transform: rotate(180deg) translateY(-42vmin); }
        #label-4 { transform: rotate(270deg) translateY(-42vmin); }

        .chart-center {
            position: absolute;
            width: 70%;
            height: 70%;
            z-index: 5;
            filter: drop-shadow(0 0 30px rgba(0,0,0,0.5));
        }

        .center-info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }

        .center-info .time {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .center-info .unit {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-top: 4px;
        }

        .status-pill {
            position: fixed;
            bottom: 40px;
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 100px;
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 rgba(16, 185, 129, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 1.8rem; }
            .center-info .time { font-size: 2.5rem; }
            #label-1 { transform: rotate(0deg) translateY(-38vmin); }
            #label-2 { transform: rotate(90deg) translateY(-38vmin); }
            #label-3 { transform: rotate(180deg) translateY(-38vmin); }
            #label-4 { transform: rotate(270deg) translateY(-38vmin); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>FlipFocus</h1>
        <p>Your Productivity Compass</p>
    </div>

    <div class="dashboard-container">
        <div class="wheel-outer" id="wheel">
            <div class="profile-label" id="label-1"><div class="label-content">Assignment</div></div>
            <div class="profile-label" id="label-2"><div class="label-content">Exam Prep</div></div>
            <div class="profile-label" id="label-3"><div class="label-content">Core Coding</div></div>
            <div class="profile-label" id="label-4"><div class="label-content">Break</div></div>
        </div>

        <div class="chart-center">
            <canvas id="donutChart"></canvas>
            <div class="center-info">
                <div class="time" id="active-time">0</div>
                <div class="unit">Seconds</div>
            </div>
        </div>
    </div>

    <div class="status-pill">
        <div class="pulse-dot"></div>
        <span>LIVE STREAM ACTIVE</span>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAlgqjJUeTN5f57PpcPckKxdOsLXLnXfzk",
            authDomain: "flipfocus-iot.firebaseapp.com",
            databaseURL: "https://flipfocus-iot-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "flipfocus-iot",
            storageBucket: "flipfocus-iot.firebasestorage.app",
            messagingSenderId: "622810947515",
            appId: "1:622810947515:web:3f8d33646c994e1e45ee9e"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const ctx = document.getElementById('donutChart').getContext('2d');
        const donutChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Assignment', 'Exam Prep', 'Core Coding', 'Break'],
                datasets: [{
                    data: [0, 0, 0, 0],
                    backgroundColor: [
                        '#38bdf8', // Sky Blue
                        '#818cf8', // Indigo
                        '#10b981', // Emerald
                        '#334155'  // Slate
                    ],
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            },
            options: {
                cutout: '75%', // Wider donut
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: false }
                },
                responsive: true,
                maintainAspectRatio: false,
                animation: {
                    duration: 1000,
                    easing: 'easeOutQuart'
                }
            }
        });

        const wheel = document.getElementById('wheel');
        const labels = [
            document.getElementById('label-1'),
            document.getElementById('label-2'),
            document.getElementById('label-3'),
            document.getElementById('label-4')
        ];
        const labelContents = labels.map(l => l.querySelector('.label-content'));
        const activeTimeDisplay = document.getElementById('active-time');

        database.ref('/profiles').on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                const metrics = [
                    data.assignment || 0,
                    data.examprep || 0,
                    data.corecoding || 0,
                    data.totalbreak || 0
                ];

                // Update Chart
                donutChart.data.datasets[0].data = metrics;
                donutChart.update();

                // Handle Rotation
                const activeIndex = (data.activeZone || 1) - 1;
                
                // Update active state
                labels.forEach((lbl, idx) => {
                    if(idx === activeIndex) lbl.classList.add('active');
                    else lbl.classList.remove('active');
                });

                // Calculate rotation
                const rotation = -(activeIndex * 90);
                wheel.style.transform = `rotate(${rotation}deg)`;

                // Keep text upright by counter-rotating the content
                labelContents.forEach((content, idx) => {
                    // Initial label offset + wheel rotation
                    const labelBaseRotation = idx * 90;
                    const totalRotation = labelBaseRotation + rotation;
                    content.style.transform = `rotate(${-totalRotation}deg)`;
                });

                // Update active time display
                activeTimeDisplay.innerText = metrics[activeIndex];
            }
        });
    </script>
</body>
</html>
