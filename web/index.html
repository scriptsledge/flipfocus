<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="FlipFocus Analytics Hub - Track study sessions, exam prep, coding time, and breaks in real-time synced with ESP32 IoT hardware.">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Permissions-Policy" content="interest-cohort=()">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://www.gstatic.com; connect-src 'self' https://flipfocus-iot-default-rtdb.asia-southeast1.firebasedatabase.app wss://flipfocus-iot-default-rtdb.asia-southeast1.firebasedatabase.app https://www.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
    <title>FlipFocus Hub - Real-Time Study Analytics</title>

    <!-- Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-dark: #070a13;
            --card-bg: rgba(15, 23, 42, 0.45);
            --card-border: rgba(255, 255, 255, 0.05);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --primary: #38bdf8;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(at 10% 10%, rgba(56, 189, 248, 0.08) 0px, transparent 40%),
                radial-gradient(at 90% 90%, rgba(16, 185, 129, 0.05) 0px, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 32px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle Blueprint grid overlay */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(56, 189, 248, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.02) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 580px;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            background: rgba(56, 189, 248, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.1);
            padding: 6px 14px;
            border-radius: 999px;
        }

        .brand-logo {
            width: 18px;
            height: 18px;
            color: var(--primary);
        }

        .brand-name {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--primary);
        }

        .title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f8fafc 40%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 8px;
            font-weight: 400;
        }

        .controls-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            padding: 12px 18px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            gap: 12px;
        }

        .status-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-main);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            position: relative;
            flex-shrink: 0;
            box-shadow: 0 0 8px var(--success);
        }

        .status-dot::after {
            content: "";
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid var(--success);
            animation: live-pulse 2s infinite ease-in-out;
            opacity: 0;
        }

        @keyframes live-pulse {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        .status-dot.historical {
            background-color: var(--warning);
            box-shadow: 0 0 8px var(--warning);
        }

        .status-dot.historical::after { display: none; }

        .dropdown-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dropdown-container label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .select-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        select {
            background: #0b0f19;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 6px 30px 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
        }

        .select-icon {
            position: absolute;
            right: 10px;
            width: 12px;
            height: 12px;
            pointer-events: none;
            color: var(--text-muted);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 130px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .icon-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(56, 189, 248, 0.06);
            color: var(--primary);
            flex-shrink: 0;
        }

        .icon-wrapper.break-icon {
            background: rgba(16, 185, 129, 0.06);
            color: var(--success);
        }

        .icon-wrapper svg {
            width: 18px;
            height: 18px;
        }

        .card h3 {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .time-display {
            display: flex;
            align-items: baseline;
            margin-top: auto;
        }

        .time-display .val {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .time-display .lbl {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-left: 2px;
            margin-right: 8px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .active-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: var(--primary);
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            display: none;
            align-items: center;
            gap: 4px;
        }

        .active-badge::before {
            content: "";
            width: 5px; height: 5px;
            border-radius: 50%;
            background-color: var(--primary);
            display: inline-block;
            animation: active-dot-pulse 1s infinite alternate;
        }

        @keyframes active-dot-pulse { from { opacity: 0.4; } to { opacity: 1; } }

        .card.active {
            border-color: rgba(56, 189, 248, 0.35);
            background: rgba(15, 23, 42, 0.7);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -10px rgba(56, 189, 248, 0.15);
        }

        .card.active h3 { color: var(--text-main); }
        .card.active .active-badge { display: flex; }

        footer { text-align: center; margin-top: 16px; padding: 12px 0; }
        .footer-text { font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase; }

        @media (max-width: 480px) {
            .grid { grid-template-columns: 1fr; }
            .title { font-size: 1.8rem; }
            .controls-panel { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="brand">
                <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <rect x="2" y="2" width="20" height="20" rx="5"></rect>
                    <path d="M7 12h10" stroke-linecap="round"></path>
                    <path d="M12 7v10" stroke-linecap="round"></path>
                </svg>
                <span class="brand-name">FLIPFOCUS</span>
            </div>
            <h1 class="title">Analytics Hub</h1>
            <p class="subtitle">Focus Session Tracker & Historical Performance Logs</p>
        </header>

        <main>
            <div class="controls-panel">
                <div class="status-banner">
                    <div class="status-dot" id="status-indicator"></div>
                    <span id="status-text">Mode: <strong>Initialising...</strong></span>
                </div>
                <div class="dropdown-container">
                    <label for="time-frame">View</label>
                    <div class="select-wrapper">
                        <select id="time-frame">
                            <option value="live">🔴 Live Stream (Today)</option>
                            <option value="Monday">Monday</option>
                            <option value="Tuesday">Tuesday</option>
                            <option value="Wednesday">Wednesday</option>
                            <option value="Thursday">Thursday</option>
                            <option value="Friday">Friday</option>
                            <option value="Saturday">Saturday</option>
                            <option value="Sunday">Sunday</option>
                        </select>
                        <svg class="select-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                </div>
            </div>

            <div class="grid">
                <div class="card" id="card-1">
                    <span class="active-badge">ACTIVE</span>
                    <div class="card-header">
                        <div class="icon-wrapper focus-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"></path><rect x="9" y="3" width="6" height="4" rx="1"></rect></svg></div>
                        <h3>Assignment Work</h3>
                    </div>
                    <div class="time-display" id="time-1"><span class="val">0</span><span class="lbl">s</span></div>
                </div>

                <div class="card" id="card-2">
                    <span class="active-badge">ACTIVE</span>
                    <div class="card-header">
                        <div class="icon-wrapper focus-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg></div>
                        <h3>Exam Prep</h3>
                    </div>
                    <div class="time-display" id="time-2"><span class="val">0</span><span class="lbl">s</span></div>
                </div>

                <div class="card" id="card-3">
                    <span class="active-badge">ACTIVE</span>
                    <div class="card-header">
                        <div class="icon-wrapper focus-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg></div>
                        <h3>Core Coding</h3>
                    </div>
                    <div class="time-display" id="time-3"><span class="val">0</span><span class="lbl">s</span></div>
                </div>

                <div class="card" id="card-4">
                    <span class="active-badge">ACTIVE</span>
                    <div class="card-header">
                        <div class="icon-wrapper break-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg></div>
                        <h3>Total Break</h3>
                    </div>
                    <div class="time-display" id="time-4"><span class="val">0</span><span class="lbl">s</span></div>
                </div>
            </div>
        </main>

        <footer>
            <p class="footer-text">FlipFocus IoT System • ₹1000 Hardware Target</p>
        </footer>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAlgqjJUeTN5f57PpcPckKxdOsLXLnXfzk",
            authDomain: "flipfocus-iot.firebaseapp.com",
            databaseURL: "https://flipfocus-iot-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "flipfocus-iot",
            storageBucket: "flipfocus-iot.firebasestorage.app",
            messagingSenderId: "622810947515",
            appId: "1:622810947515:web:dfab252ddf70ae7645ee9e"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database("https://flipfocus-iot-default-rtdb.asia-southeast1.firebasedatabase.app");
        let currentListenerRef = null;

        function formatTime(seconds) {
            const sec = parseInt(seconds || 0, 10);
            if (sec <= 0) return '<span class="val">0</span><span class="lbl">s</span>';
            const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
            let html = "";
            if (h > 0) html += `<span class="val">${h}</span><span class="lbl">h</span>`;
            if (m > 0) html += `<span class="val">${m}</span><span class="lbl">m</span>`;
            if (s > 0 || (h === 0 && m === 0)) html += `<span class="val">${s}</span><span class="lbl">s</span>`;
            return html;
        }

        function updateCardMetrics(nodeData) {
            document.getElementById('time-1').innerHTML = formatTime(nodeData.assignment);
            document.getElementById('time-2').innerHTML = formatTime(nodeData.examprep);
            document.getElementById('time-3').innerHTML = formatTime(nodeData.corecoding);
            document.getElementById('time-4').innerHTML = formatTime(nodeData.totalbreak);
        }

        function highlightActiveCard(activeZoneIndex) {
            for (let i = 1; i <= 4; i++) document.getElementById(`card-${i}`).classList.remove('active');
            if (activeZoneIndex) {
                const targetCard = document.getElementById(`card-${activeZoneIndex}`);
                if (targetCard) targetCard.classList.add('active');
            }
        }

        function viewModeChanged() {
            const choice = document.getElementById('time-frame').value;
            const statusIndicator = document.getElementById('status-indicator');
            const statusText = document.getElementById('status-text');

            if (currentListenerRef) currentListenerRef.off();

            if (choice === 'live') {
                statusIndicator.className = 'status-dot';
                statusText.innerHTML = 'Mode: <strong>Live Tracking Stream</strong>';
                currentListenerRef = database.ref('/profiles');
            } else {
                statusIndicator.className = 'status-dot historical';
                statusText.innerHTML = `Viewing Log: <strong>Archive (${choice})</strong>`;
                currentListenerRef = database.ref(`/profiles/history/${choice}`);
            }

            currentListenerRef.on('value', (snapshot) => {
                const data = snapshot.val();
                console.log("Data Received:", data);
                if (data) {
                    updateCardMetrics(choice === 'live' ? {
                        assignment: data.assignment,
                        examprep: data.examprep,
                        corecoding: data.corecoding,
                        totalbreak: data.totalbreak
                    } : data);
                    if (choice === 'live') highlightActiveCard(data.activeZone);
                    else highlightActiveCard(null);
                }
            }, (error) => {
                console.error("Sync Error:", error);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('time-frame').addEventListener('change', viewModeChanged);
            firebase.auth().signInAnonymously()
                .then(() => {
                    console.log("✅ Auth Success");
                    viewModeChanged();
                })
                .catch(err => {
                    console.error("❌ Auth Fail", err);
                    document.getElementById('status-text').innerHTML = '❌ <strong>Auth Error</strong>';
                });
        });
    </script>
</body>
</html>
