<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlipFocus Hub | Student Performance Logs</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(30, 41, 59, 0.4);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --primary: #38bdf8;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 1100px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2.5rem; font-weight: 800; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: var(--text-muted); margin-top: 10px; font-size: 1.1rem; }

        .controls-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--card-border);
            padding: 16px 30px;
            border-radius: 20px;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
        }

        .status-banner { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; }
        .status-dot { width: 10px; height: 10px; background-color: var(--success); border-radius: 50%; box-shadow: 0 0 12px var(--success); }
        .status-dot.historical { background-color: var(--warning); box-shadow: 0 0 12px var(--warning); }

        .dropdown-container { display: flex; align-items: center; gap: 12px; }
        .dropdown-container label { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        
        select {
            background: #0f172a;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; width: 100%; }
        .card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--card-border); border-radius: 24px; padding: 30px; position: relative; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .card h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); font-weight: 600; }
        
        .time-display { margin-top: 20px; display: flex; align-items: baseline; }
        .time-val { font-size: 3.5rem; font-weight: 700; color: var(--text-main); line-height: 1; font-variant-numeric: tabular-nums; }
        .unit { font-size: 1.2rem; color: var(--text-muted); margin-left: 6px; }

        .active-badge { position: absolute; top: 24px; right: 24px; background: rgba(16, 185, 129, 0.15); color: #34d399; padding: 4px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; display: none; border: 1px solid rgba(16, 185, 129, 0.2); }
        
        .card.active { border-color: rgba(56, 189, 248, 0.4); box-shadow: 0 20px 40px -15px rgba(56, 189, 248, 0.15); background: rgba(15, 23, 42, 0.6); transform: translateY(-4px); }
        .card.active h3 { color: var(--primary); }
        .card.active .active-badge { display: block; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>FLIPFOCUS ANALYTICS HUB</h1>
            <p>Time-Tracking Data Logger & Historical Performance Logs</p>
        </div>

        <div class="controls-panel">
            <div class="status-banner">
                <div class="status-dot" id="status-indicator"></div>
                <span id="status-text">Mode: <strong>Live Tracking Stream</strong></span>
            </div>
            
            <div class="dropdown-container">
                <label for="time-frame">Select View:</label>
                <select id="time-frame" onchange="viewModeChanged()">
                    <option value="live">🔴 Live Stream (Today)</option>
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday">Saturday</option>
                    <option value="Sunday">Sunday</option>
                </select>
            </div>
        </div>

        <div class="grid">
            <div class="card" id="card-1">
                <span class="active-badge">RUNNING</span>
                <h3>1. Assignment Work</h3>
                <div class="time-display"><span class="time-val" id="time-1">0</span><span class="unit">s</span></div>
            </div>
            <div class="card" id="card-2">
                <span class="active-badge">RUNNING</span>
                <h3>2. Exam Prep</h3>
                <div class="time-display"><span class="time-val" id="time-2">0</span><span class="unit">s</span></div>
            </div>
            <div class="card" id="card-3">
                <span class="active-badge">RUNNING</span>
                <h3>3. Core Coding</h3>
                <div class="time-display"><span class="time-val" id="time-3">0</span><span class="unit">s</span></div>
            </div>
            <div class="card" id="card-4">
                <span class="active-badge">RUNNING</span>
                <h3>4. Total Break</h3>
                <div class="time-display"><span class="time-val" id="time-4">0</span><span class="unit">s</span></div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAlgqjJUeTN5f57PpcPckKxdOsLXLnXfzk",
            authDomain: "flipfocus-iot.firebaseapp.com",
            databaseURL: "https://flipfocus-iot-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "flipfocus-iot",
            storageBucket: "flipfocus-iot.firebasestorage.app",
            messagingSenderId: "622810947515",
            appId: "1:622810947515:web:3f8d33646c994e1e45ee9e"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        let currentListenerRef = null;

        function viewModeChanged() {
            const selector = document.getElementById('time-frame');
            const choice = selector.value;
            
            const statusIndicator = document.getElementById('status-indicator');
            const statusText = document.getElementById('status-text');

            if (currentListenerRef) {
                currentListenerRef.off();
            }

            if (choice === 'live') {
                statusIndicator.className = "status-dot";
                statusText.innerHTML = "Mode: <strong>Live Tracking Stream</strong>";
                
                currentListenerRef = database.ref('/profiles');
                currentListenerRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if(data) {
                        // Map current data using the new naming slots
                        updateCardMetrics({
                            assignment: data.assignment,
                            examprep: data.examprep,
                            corecoding: data.corecoding,
                            totalbreak: data.totalbreak
                        });
                        highlightActiveCard(data.activeZone);
                    }
                });
            } else {
                statusIndicator.className = "status-dot historical";
                statusText.innerHTML = `Viewing Log: <strong>Archive (${choice})</strong>`;
                
                currentListenerRef = database.ref(`/profiles/history/${choice}`);
                currentListenerRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    
                    // Defaults safely to 0 if a past day isn't manually seeded yet
                    if(!data) {
                        updateCardMetrics({ assignment: 0, examprep: 0, corecoding: 0, totalbreak: 0 });
                    } else {
                        updateCardMetrics(data);
                    }
                    highlightActiveCard(null); 
                });
            }
        }

        function updateCardMetrics(nodeData) {
            document.getElementById('time-1').innerText = nodeData.assignment ?? 0;
            document.getElementById('time-2').innerText = nodeData.examprep ?? 0;
            document.getElementById('time-3').innerText = nodeData.corecoding ?? 0;
            document.getElementById('time-4').innerText = nodeData.totalbreak ?? 0;
        }

        function highlightActiveCard(activeZoneIndex) {
            for(let i = 1; i <= 4; i++) {
                document.getElementById(`card-${i}`).classList.remove('active');
            }
            if(activeZoneIndex) {
                const targetCard = document.getElementById(`card-${activeZoneIndex}`);
                if(targetCard) targetCard.classList.add('active');
            }
        }

        viewModeChanged();
    </script>
</body>
</html>
