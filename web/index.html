<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlipFocus Hub | Modern Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root {
            --bg-dark: #090d16;
            --primary: #38bdf8; /* Sky Blue */
            --success: #10b981; /* Emerald */
            --slate: #334155;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --card-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }

        .header { text-align: center; margin-bottom: 40px; z-index: 10; }
        .header h1 { font-size: 2.2rem; font-weight: 800; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
        .header p { color: var(--text-muted); margin-top: 8px; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }

        .dashboard-container {
            position: relative;
            width: 90vmin;
            height: 90vmin;
            max-width: 600px;
            max-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid var(--card-border);
            border-radius: 50%;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .profile-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center;
            text-align: center;
            width: 120px;
            margin-left: -60px;
            margin-top: -15px;
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.4s ease;
        }

        .profile-label.active {
            color: var(--primary);
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        /* Position labels at 0, 90, 180, 270 degrees */
        .profile-label:nth-child(1) { transform: rotate(0deg) translateY(-40vmin); }
        .profile-label:nth-child(2) { transform: rotate(90deg) translateY(-40vmin) rotate(-90deg); }
        .profile-label:nth-child(3) { transform: rotate(180deg) translateY(-40vmin) rotate(-180deg); }
        .profile-label:nth-child(4) { transform: rotate(270deg) translateY(-40vmin) rotate(-270deg); }

        /* Correction for label orientation so they are always upright relative to the container, 
           but we want them to stay in their slots. 
           Actually, let's just rotate the whole container and rotate the labels back. */
        .profile-label:nth-child(1) span { transform: rotate(0deg); display: inline-block; }
        .profile-label:nth-child(2) span { transform: rotate(0deg); display: inline-block; }
        .profile-label:nth-child(3) span { transform: rotate(0deg); display: inline-block; }
        .profile-label:nth-child(4) span { transform: rotate(0deg); display: inline-block; }

        .chart-center {
            position: absolute;
            width: 65%;
            height: 65%;
            z-index: 5;
        }

        .center-info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }

        .center-info .time {
            font-size: 3rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1;
        }

        .center-info .unit {
            font-size: 1rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .status-indicator {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
        }

        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 10px var(--success); }

        @media (max-width: 600px) {
            .profile-label:nth-child(1) { transform: rotate(0deg) translateY(-38vmin); }
            .profile-label:nth-child(2) { transform: rotate(90deg) translateY(-38vmin) rotate(-90deg); }
            .profile-label:nth-child(3) { transform: rotate(180deg) translateY(-38vmin) rotate(-180deg); }
            .profile-label:nth-child(4) { transform: rotate(270deg) translateY(-38vmin) rotate(-270deg); }
            .center-info .time { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>FLIPFOCUS</h1>
        <p>Dynamic Productivity Flow</p>
    </div>

    <div class="dashboard-container">
        <div class="wheel-outer" id="wheel">
            <div class="profile-label" id="label-1"><span>Assignment</span></div>
            <div class="profile-label" id="label-2"><span>Exam Prep</span></div>
            <div class="profile-label" id="label-3"><span>Core Coding</span></div>
            <div class="profile-label" id="label-4"><span>Break</span></div>
        </div>

        <div class="chart-center">
            <canvas id="donutChart"></canvas>
            <div class="center-info">
                <div class="time" id="active-time">0</div>
                <div class="unit">Seconds</div>
            </div>
        </div>
    </div>

    <div class="status-indicator">
        <div class="dot"></div>
        <span>Live System Active</span>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAlgqjJUeTN5f57PpcPckKxdOsLXLnXfzk",
            authDomain: "flipfocus-iot.firebaseapp.com",
            databaseURL: "https://flipfocus-iot-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "flipfocus-iot",
            storageBucket: "flipfocus-iot.firebasestorage.app",
            messagingSenderId: "622810947515",
            appId: "1:622810947515:web:3f8d33646c994e1e45ee9e"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const ctx = document.getElementById('donutChart').getContext('2d');
        const donutChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Assignment', 'Exam Prep', 'Core Coding', 'Break'],
                datasets: [{
                    data: [0, 0, 0, 0],
                    backgroundColor: [
                        '#38bdf8', // Sky Blue
                        '#818cf8', // Indigo
                        '#10b981', // Emerald
                        '#334155'  // Slate
                    ],
                    borderWidth: 0,
                    hoverOffset: 10
                }]
            },
            options: {
                cutout: '85%',
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: false }
                },
                responsive: true,
                maintainAspectRatio: false,
                animation: {
                    duration: 1000,
                    easing: 'easeOutQuart'
                }
            }
        });

        const wheel = document.getElementById('wheel');
        const labels = [
            document.getElementById('label-1'),
            document.getElementById('label-2'),
            document.getElementById('label-3'),
            document.getElementById('label-4')
        ];
        const activeTimeDisplay = document.getElementById('active-time');

        database.ref('/profiles').on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                const metrics = [
                    data.assignment || 0,
                    data.examprep || 0,
                    data.corecoding || 0,
                    data.totalbreak || 0
                ];

                // Update Chart
                donutChart.data.datasets[0].data = metrics;
                donutChart.update();

                // Handle Rotation
                const activeIndex = (data.activeZone || 1) - 1; // 1-based to 0-based
                
                // Set active label styling
                labels.forEach((lbl, idx) => {
                    if(idx === activeIndex) lbl.classList.add('active');
                    else lbl.classList.remove('active');
                });

                // Calculate rotation to put active label at top (0 degrees)
                // Label 1 is at 0 deg, Label 2 at 90, Label 3 at 180, Label 4 at 270.
                // To put index I at top, we rotate the wheel by - (I * 90) degrees.
                const rotation = -(activeIndex * 90);
                wheel.style.transform = `rotate(${rotation}deg)`;

                // Update active time display
                activeTimeDisplay.innerText = metrics[activeIndex];
            }
        });
    </script>
</body>
</html>
