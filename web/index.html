<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlipFocus | Dynamic Flow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root {
            --bg-dark: #070b14;
            --primary: #38bdf8;
            --secondary: #818cf8;
            --success: #10b981;
            --slate: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --active-glow: rgba(56, 189, 248, 0.4);
            --inactive-segment: #1e293b;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 90% 90%, rgba(129, 140, 248, 0.03) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
        }

        .header { 
            text-align: center; 
            margin-bottom: clamp(20px, 8vh, 60px); 
            z-index: 10; 
        }
        .header h1 { 
            font-size: clamp(1.8rem, 5vw, 2.8rem); 
            font-weight: 800; 
            letter-spacing: -0.03em; 
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px; 
        }
        .header p { 
            color: var(--text-muted); 
            font-size: clamp(0.7rem, 2vw, 0.9rem); 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 0.15em; 
        }

        .dashboard-wrapper {
            position: relative;
            width: clamp(280px, 85vmin, 580px);
            height: clamp(280px, 85vmin, 580px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2;
        }

        .profile-label {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 140px;
            margin-left: -70px;
            margin-top: -20px;
            text-align: center;
            transition: all 0.4s ease;
            pointer-events: none;
        }

        .label-content {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: clamp(0.7rem, 2.5vmin, 0.85rem);
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            border: 1px solid transparent;
        }

        .profile-label.active .label-content {
            color: var(--text-main);
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 0 30px var(--active-glow);
            transform: scale(1.15);
        }

        /* Distribution on the wheel */
        #label-1 { transform: rotate(0deg) translateY(-44vmin) translateY(clamp(-30px, -2vmin, -10px)); }
        #label-2 { transform: rotate(90deg) translateY(-44vmin) translateY(clamp(-30px, -2vmin, -10px)); }
        #label-3 { transform: rotate(180deg) translateY(-44vmin) translateY(clamp(-30px, -2vmin, -10px)); }
        #label-4 { transform: rotate(270deg) translateY(-44vmin) translateY(clamp(-30px, -2vmin, -10px)); }

        .chart-container {
            position: absolute;
            width: 72%;
            height: 72%;
            z-index: 1;
            filter: drop-shadow(0 0 40px rgba(0,0,0,0.6));
            transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .center-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 3;
        }

        .center-display .time-value {
            font-size: clamp(2.5rem, 10vmin, 4.5rem);
            font-weight: 800;
            color: var(--text-main);
            line-height: 0.9;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        .center-display .unit-label {
            font-size: clamp(0.6rem, 2vmin, 0.8rem);
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3em;
            margin-top: 8px;
            font-weight: 600;
        }

        .status-bar {
            position: fixed;
            bottom: clamp(20px, 5vh, 40px);
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            padding: 10px 20px;
            border-radius: 100px;
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
            animation: breathe 2s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.4; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Mobile specific adjustments */
        @media (max-height: 700px) {
            .header { margin-bottom: 20px; }
            .status-bar { bottom: 15px; }
        }

        @media (max-width: 480px) {
            .profile-label { width: 110px; margin-left: -55px; }
            .label-content { padding: 6px 12px; font-size: 0.65rem; }
            #label-1, #label-2, #label-3, #label-4 { 
                transform: rotate(var(--rot)) translateY(-40vmin);
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>FlipFocus</h1>
        <p>Dynamic Flow Engine</p>
    </div>

    <div class="dashboard-wrapper">
        <div class="wheel-outer" id="wheel">
            <div class="profile-label" id="label-1" style="--rot: 0deg;"><div class="label-content">Assignment</div></div>
            <div class="profile-label" id="label-2" style="--rot: 90deg;"><div class="label-content">Exam Prep</div></div>
            <div class="profile-label" id="label-3" style="--rot: 180deg;"><div class="label-content">Core Coding</div></div>
            <div class="profile-label" id="label-4" style="--rot: 270deg;"><div class="label-content">Break</div></div>
        </div>

        <div class="chart-container" id="chart-rotator">
            <canvas id="donutChart"></canvas>
        </div>

        <div class="center-display">
            <div class="time-value" id="active-time">0</div>
            <div class="unit-label">Seconds</div>
        </div>
    </div>

    <div class="status-bar">
        <div class="live-dot"></div>
        <span>SYNCED WITH ESP32</span>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAlgqjJUeTN5f57PpcPckKxdOsLXLnXfzk",
            authDomain: "flipfocus-iot.firebaseapp.com",
            databaseURL: "https://flipfocus-iot-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "flipfocus-iot",
            storageBucket: "flipfocus-iot.firebasestorage.app",
            messagingSenderId: "622810947515",
            appId: "1:622810947515:web:3f8d33646c994e1e45ee9e"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const THEME = {
            colors: ['#38bdf8', '#818cf8', '#10b981', '#64748b'],
            inactive: '#1e293b'
        };

        const ctx = document.getElementById('donutChart').getContext('2d');
        const donutChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Assignment', 'Exam Prep', 'Core Coding', 'Break'],
                datasets: [{
                    data: [1, 1, 1, 1], // Placeholder to show chart initially
                    backgroundColor: THEME.colors,
                    borderWidth: 0,
                    borderRadius: 4,
                    spacing: 8
                }]
            },
            options: {
                cutout: '82%',
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: false }
                },
                responsive: true,
                maintainAspectRatio: false,
                animation: {
                    duration: 1200,
                    easing: 'easeOutQuart'
                }
            }
        });

        const wheel = document.getElementById('wheel');
        const chartRotator = document.getElementById('chart-rotator');
        const labels = [
            document.getElementById('label-1'),
            document.getElementById('label-2'),
            document.getElementById('label-3'),
            document.getElementById('label-4')
        ];
        const labelContents = labels.map(l => l.querySelector('.label-content'));
        const activeTimeDisplay = document.getElementById('active-time');

        database.ref('/profiles').on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                const metrics = [
                    data.assignment || 0,
                    data.examprep || 0,
                    data.corecoding || 0,
                    data.totalbreak || 0
                ];

                const activeIndex = (data.activeZone || 1) - 1;

                // 1. Update Chart Data & Colors
                donutChart.data.datasets[0].data = metrics.map(v => v === 0 ? 0.01 : v); // Avoid hidden segments
                donutChart.data.datasets[0].backgroundColor = metrics.map((_, idx) => 
                    idx === activeIndex ? THEME.colors[idx] : THEME.inactive
                );
                donutChart.update();

                // 2. Handle Rotation (Sync Wheel and Chart)
                const rotation = -(activeIndex * 90);
                wheel.style.transform = `rotate(${rotation}deg)`;
                chartRotator.style.transform = `rotate(${rotation}deg)`;

                // 3. Keep text upright and handle active states
                labels.forEach((lbl, idx) => {
                    const content = labelContents[idx];
                    const labelBaseRotation = idx * 90;
                    const totalRotation = labelBaseRotation + rotation;
                    
                    content.style.transform = `rotate(${-totalRotation}deg)`;
                    
                    if(idx === activeIndex) lbl.classList.add('active');
                    else lbl.classList.remove('active');
                });

                // 4. Update Time
                activeTimeDisplay.innerText = Math.floor(metrics[activeIndex]);
            }
        });
    </script>
</body>
</html>
