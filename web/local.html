<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlipFocus | Local USB Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #070b14;
            --primary: #38bdf8;
            --secondary: #818cf8;
            --success: #10b981;
            --slate: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --active-glow: rgba(56, 189, 248, 0.4);
            --inactive-segment: #1e293b;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 90% 90%, rgba(129, 140, 248, 0.03) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            overflow-x: hidden;
            overflow-y: auto;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
        }

        html { height: -webkit-fill-available; }

        .header { 
            text-align: center; 
            z-index: 10;
            margin: 10px 0;
            padding-top: 10px;
        }
        .header h1 { 
            font-size: clamp(1.8rem, 6vh, 2.8rem); 
            font-weight: 800; 
            letter-spacing: -0.03em; 
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px; 
        }
        .header p { 
            color: var(--text-muted); 
            font-size: clamp(0.65rem, 1.8vh, 0.85rem); 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 0.12em; 
        }

        .dashboard-wrapper {
            position: relative;
            width: clamp(240px, 60vmin, 380px);
            height: clamp(240px, 60vmin, 380px);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }

        .chart-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            filter: drop-shadow(0 0 30px rgba(56, 189, 248, 0.05));
        }

        .center-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 3;
            width: 70%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .active-profile-name {
            font-size: clamp(0.7rem, 2vw, 0.95rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--primary);
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }

        .center-display .time-value {
            font-size: clamp(2.2rem, 8vw, 3.8rem);
            font-weight: 800;
            color: var(--text-main);
            line-height: 1;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        .center-display .unit-label {
            font-size: clamp(0.55rem, 1.5vw, 0.7rem);
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.25em;
            margin-top: 4px;
            font-weight: 600;
        }

        .status-bar {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            padding: 8px 18px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            margin-bottom: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .status-bar:hover {
            border-color: rgba(56, 189, 248, 0.4);
            background: rgba(15, 23, 42, 0.9);
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ef4444;
            box-shadow: 0 0 10px #ef4444;
            animation: breathe 2s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.4; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .mode-link {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-decoration: none;
            margin-top: 10px;
            opacity: 0.7;
            transition: all 0.3s;
            z-index: 10;
        }

        .mode-link:hover {
            color: var(--primary);
            opacity: 1;
        }

        /* Landscape Mobile Fix: Prevents UI from being cut off */
        @media (max-height: 500px) and (orientation: landscape) {
            body { justify-content: space-around; padding: 5px; }
            .header { margin: 0; }
            .header h1 { font-size: 1.5rem; }
            .dashboard-wrapper { height: 50vh; width: 50vh; margin: 5px 0; }
            .status-bar { margin-bottom: 5px; padding: 5px 15px; }
            .control-panel { padding: 10px 15px; margin: 5px 0; }
        }

        @media (max-width: 480px) {
            .profile-label { width: 110px; margin-left: -55px; }
            .label-content { font-size: 0.6rem; padding: 4px 10px; }
            #label-1, #label-2, #label-3, #label-4 { 
                transform: rotate(var(--rot)) translateY(-38vmin);
            }
        }

        .control-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 15px 20px;
            width: clamp(260px, 85vw, 420px);
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 10;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .timer-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .timer-display {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.05em;
        }

        .timer-controls {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        .timer-btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .timer-btn:hover {
            background: var(--primary);
            color: var(--bg-dark);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .timer-presets {
            display: flex;
            gap: 6px;
            margin-top: 4px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .preset-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .preset-btn:hover, .preset-btn.active {
            border-color: var(--secondary);
            color: var(--text-main);
            background: rgba(129, 140, 248, 0.1);
        }

        .action-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            color: var(--bg-dark);
            width: 100%;
            padding: 10px 16px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }
        
        .action-btn:active {
            transform: translateY(1px);
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 900px;
            gap: 20px;
            z-index: 10;
        }

        @media (min-width: 768px), (max-height: 500px) and (orientation: landscape) {
            .main-content {
                flex-direction: row;
                gap: 50px;
                margin: auto 0;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>FlipFocus</h1>
        <p>Smart Productivity Tracker (Local USB)</p>
    </div>

    <div class="main-content">
        <div class="dashboard-wrapper">
            <div class="chart-container">
                <canvas id="donutChart"></canvas>
            </div>

            <div class="center-display">
                <div class="active-profile-name" id="active-profile-name">SELECT PROFILE</div>
                <div class="time-value" id="active-time">0</div>
                <div class="unit-label">Seconds</div>
            </div>
        </div>

        <!-- Interactive Control Panel -->
        <div class="control-panel">
            <div class="timer-section">
                <div class="timer-display" id="timer-text">25:00</div>
                <div class="timer-controls">
                    <button class="timer-btn" id="timer-start">▶ Start</button>
                    <button class="timer-btn" id="timer-reset">↺ Reset</button>
                </div>
                <div class="timer-presets">
                    <button class="preset-btn active" data-time="1500" id="preset-25m">25m</button>
                    <button class="preset-btn" data-time="3000" id="preset-50m">50m</button>
                    <button class="preset-btn" data-time="5" id="preset-5s">5s</button>
                    <button class="preset-btn" data-time="10" id="preset-10s">10s</button>
                    <button class="preset-btn" id="custom-preset-btn">✎ Custom</button>
                </div>
            </div>
            
            <button class="action-btn" id="ping-btn">🔔 Ping Device (team: overAI)</button>
        </div>
    </div>

    <div class="status-bar" id="connect-btn">
        <div class="live-dot" id="status-dot"></div>
        <span id="status-text">CLICK TO CONNECT USB</span>
    </div>

    <a href="index.html" class="mode-link">☁️ Switch to Cloud Sync Mode</a>

    <script>
        const THEME = {
            colors: ['#38bdf8', '#818cf8', '#10b981', '#64748b'],
            inactive: '#1e293b'
        };

        const ctx = document.getElementById('donutChart').getContext('2d');
        const donutChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Assignment', 'Exam Prep', 'Core Coding', 'Break'],
                datasets: [{
                    data: [1, 1, 1, 1],
                    backgroundColor: THEME.colors,
                    borderWidth: 0,
                    borderRadius: 4,
                    spacing: 8
                }]
            },
            options: {
                cutout: '82%',
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: false }
                },
                responsive: true,
                maintainAspectRatio: false,
                animation: {
                    duration: 1200,
                    easing: 'easeOutQuart'
                }
            }
        });

        const activeTimeDisplay = document.getElementById('active-time');
        const activeProfileDisplay = document.getElementById('active-profile-name');
        const profileNames = ['Assignment', 'Exam Prep', 'Core Coding', 'Break'];
        const connectBtn = document.getElementById('connect-btn');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');

        let port;
        let reader;

        async function connect() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                statusText.innerText = "USB CONNECTED";
                statusDot.style.background = "#10b981";
                statusDot.style.boxShadow = "0 0 10px #10b981";
                
                readLoop();
            } catch (e) {
                console.error(e);
                statusText.innerText = "CONNECTION FAILED";
                statusDot.style.background = "#ef4444";
                statusDot.style.boxShadow = "0 0 10px #ef4444";
            }
        }

        async function readLoop() {
            const textDecoder = new TextDecoderStream();
            const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
            const inputStream = textDecoder.readable;
            reader = inputStream.getReader();

            let buffer = "";

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                
                buffer += value;
                const lines = buffer.split("\n");
                buffer = lines.pop();

                for (const line of lines) {
                    try {
                        const data = JSON.parse(line.trim());
                        updateUI(data);
                    } catch (e) {
                        // Incomplete JSON or noise
                    }
                }
            }
        }

        function updateUI(data) {
            const metrics = [
                data.assignment || 0,
                data.examprep || 0,
                data.corecoding || 0,
                data.totalbreak || 0
            ];

            const activeIndex = (data.activeZone || 1) - 1;

            donutChart.data.datasets[0].data = metrics.map(v => v === 0 ? 0.01 : v);
            donutChart.data.datasets[0].backgroundColor = metrics.map((_, idx) => 
                idx === activeIndex ? THEME.colors[idx] : THEME.inactive
            );
            donutChart.update();

            activeProfileDisplay.innerText = profileNames[activeIndex];
            activeProfileDisplay.style.color = THEME.colors[activeIndex];
            activeTimeDisplay.innerText = Math.floor(metrics[activeIndex]);
        }

        connectBtn.addEventListener('click', connect);

        // Countdown Timer Logic
        let timerSeconds = 1500; // default 25m
        let timerInterval = null;
        let isTimerRunning = false;
        
        const timerText = document.getElementById('timer-text');
        const timerStartBtn = document.getElementById('timer-start');
        const timerResetBtn = document.getElementById('timer-reset');
        const presetBtns = document.querySelectorAll('.preset-btn');
        const pingBtn = document.getElementById('ping-btn');
        
        function updateTimerDisplay() {
            const m = Math.floor(timerSeconds / 60);
            const s = timerSeconds % 60;
            timerText.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }
        
        function startTimer() {
            if (isTimerRunning) {
                // Pause
                clearInterval(timerInterval);
                timerStartBtn.innerText = '▶ Start';
                isTimerRunning = false;
            } else {
                // Start
                timerStartBtn.innerText = '⏸ Pause';
                isTimerRunning = true;
                timerInterval = setInterval(() => {
                    if (timerSeconds > 0) {
                        timerSeconds--;
                        updateTimerDisplay();
                    } else {
                        // Complete!
                        clearInterval(timerInterval);
                        timerStartBtn.innerText = '▶ Start';
                        isTimerRunning = false;
                        
                        playAlertSound();
                        triggerDeviceAlarm();
                        
                        alert("Session Completed! Focus timer finished.");
                    }
                }, 1000);
            }
        }
        
        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            timerStartBtn.innerText = '▶ Start';
            const activePreset = document.querySelector('.preset-btn.active');
            if (activePreset && activePreset.dataset.time) {
                timerSeconds = parseInt(activePreset.dataset.time);
            } else {
                timerSeconds = 1500;
            }
            updateTimerDisplay();
        }
        
        function playAlertSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                oscillator.start();
                setTimeout(() => { oscillator.stop(); }, 500);
            } catch (e) {
                console.log("Audio API blocked or not supported");
            }
        }
        
        async function triggerDevicePing() {
            if (port && port.writable) {
                try {
                    const encoder = new TextEncoder();
                    const writer = port.writable.getWriter();
                    await writer.write(encoder.encode("ping\n"));
                    writer.releaseLock();
                    console.log("Sent 'ping' command to ESP32 over serial.");
                } catch(e) {
                    console.error("Failed to write to serial port:", e);
                }
            } else {
                console.warn("Serial port not connected.");
                alert("USB device not connected. Please connect USB first!");
            }
        }

        async function triggerDeviceAlarm() {
            if (port && port.writable) {
                try {
                    const encoder = new TextEncoder();
                    const writer = port.writable.getWriter();
                    await writer.write(encoder.encode("alarm\n"));
                    writer.releaseLock();
                    console.log("Sent 'alarm' command to ESP32 over serial.");
                } catch(e) {
                    console.error("Failed to write to serial port:", e);
                }
            } else {
                console.warn("Serial port not connected.");
            }
        }
        
        // Listeners
        timerStartBtn.addEventListener('click', startTimer);
        timerResetBtn.addEventListener('click', resetTimer);
        pingBtn.addEventListener('click', triggerDevicePing);
        
        presetBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (e.target.id === 'custom-preset-btn') return;
                
                presetBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                timerSeconds = parseInt(e.target.dataset.time);
                updateTimerDisplay();
                
                if (isTimerRunning) {
                    clearInterval(timerInterval);
                    isTimerRunning = false;
                    timerStartBtn.innerText = '▶ Start';
                }
            });
        });
        
        document.getElementById('custom-preset-btn').addEventListener('click', (e) => {
            const input = prompt("Enter custom duration (e.g. '10s' for 10 seconds or '15m' for 15 minutes):");
            if (input) {
                let sec = 0;
                if (input.endsWith('s')) {
                    sec = parseInt(input.slice(0, -1));
                } else if (input.endsWith('m')) {
                    sec = parseInt(input.slice(0, -1)) * 60;
                } else {
                    sec = parseInt(input) * 60;
                }
                
                if (!isNaN(sec) && sec > 0) {
                    presetBtns.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    timerSeconds = sec;
                    updateTimerDisplay();
                    
                    if (isTimerRunning) {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                        timerStartBtn.innerText = '▶ Start';
                    }
                }
            }
        });
        
        // Init
        updateTimerDisplay();
    </script>
</body>
</html>
